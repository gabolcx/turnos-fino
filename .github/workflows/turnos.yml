name: Chequear turnos

# Cada corrida dura 5 h 30 min, chequea cada 15 minutos y, al terminar, deja en cola la
# siguiente (workflow_dispatch), así siempre hay una activa. De 01:00 a 08:00 ART no chequea
# pero sigue viva para que la cadena llegue a la mañana.
# El cron es solo un respaldo por si la cadena se corta (GitHub saltea la mayoría de los cron).
# Si arranca mientras otra corre, queda en cola y suele aparecer como "cancelled": es normal.
# Para frenarlo todo: botón "Pausar" en Telegram, o Actions → "Chequear turnos" → Disable workflow.
on:
  schedule:
    # GitHub usa UTC (ART = UTC-3).
    - cron: "17 * * * *"
  workflow_dispatch:          # lo usa la cadena y permite correrlo a mano desde la pestaña Actions
    inputs:
      run_minutes:
        description: "Minutos que dura la corrida (0 = un solo chequeo, sin encadenar)"
        default: "330"

permissions:
  contents: read
  actions: write   # para pausar este workflow y lanzar la corrida siguiente

# Una sola corrida a la vez; la siguiente queda en cola y arranca cuando termina la anterior.
concurrency:
  group: turnos
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Recuerda qué turnos ya se avisaron, para no repetir el mensaje.
      - name: Restaurar estado
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: turnos-state-${{ github.run_id }}
          restore-keys: turnos-state-

      - name: Chequear turnos
        env:
          PORTAL_EMAIL: ${{ secrets.PORTAL_EMAIL }}
          PORTAL_PASSWORD: ${{ secrets.PORTAL_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Los médicos van como secrets para que no queden a la vista en el repo ni en los logs.
          MAIN_DOCTOR: ${{ secrets.MAIN_DOCTOR }}
          SECOND_DOCTOR: ${{ secrets.SECOND_DOCTOR }}
          GITHUB_TOKEN: ${{ github.token }}
          DAYS_AHEAD: ${{ vars.DAYS_AHEAD || '7' }}
          DRY_RUN: ${{ vars.DRY_RUN || '0' }}
          # 5 h 30 min por corrida (el límite de GitHub es 6 h), chequeando cada 15 minutos.
          RUN_MINUTES: ${{ inputs.run_minutes || '330' }}
          CHECK_EVERY_MINUTES: "15"
        run: python -u check_turnos.py

      - name: Guardar estado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: turnos-state-${{ github.run_id }}
