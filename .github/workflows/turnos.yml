name: Chequear turnos Fugazzotto

on:
  schedule:
    # Cada 15 minutos de 08:00 a 01:00 hora argentina (UTC-3); de 01:00 a 08:00 no corre.
    # GitHub usa UTC: 11-23 UTC = 08-20 ART y 0-3 UTC = 21-00:45 ART.
    - cron: "*/15 11-23 * * *"
    - cron: "*/15 0-3 * * *"
  workflow_dispatch:          # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: read
  actions: write   # para que el bot pueda pausar este workflow

concurrency:
  group: turnos
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Recuerda qué turnos ya se avisaron, para no repetir el mensaje cada 15 minutos.
      - name: Restaurar estado
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: turnos-state-${{ github.run_id }}
          restore-keys: turnos-state-

      - name: Chequear turnos
        env:
          PORTAL_EMAIL: ${{ secrets.PORTAL_EMAIL }}
          PORTAL_PASSWORD: ${{ secrets.PORTAL_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          DAYS_AHEAD: ${{ vars.DAYS_AHEAD || '7' }}
          # Si hay turnos ofrecidos, espera tu respuesta en Telegram para reservar enseguida.
          LISTEN_MINUTES: "12"
          DRY_RUN: ${{ vars.DRY_RUN || '0' }}
        run: python check_turnos.py

      - name: Guardar estado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: turnos-state-${{ github.run_id }}
