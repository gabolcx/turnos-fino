name: Chequear turnos Fugazzotto

on:
  schedule:
    - cron: "*/15 * * * *"   # cada 15 minutos (GitHub puede demorarlo unos minutos)
  workflow_dispatch:          # permite correrlo a mano desde la pestaña Actions

concurrency:
  group: turnos
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Recuerda qué turnos ya se avisaron, para no repetir el mensaje cada 15 minutos.
      - name: Restaurar estado
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: turnos-state-${{ github.run_id }}
          restore-keys: turnos-state-

      - name: Chequear turnos
        env:
          PORTAL_EMAIL: ${{ secrets.PORTAL_EMAIL }}
          PORTAL_PASSWORD: ${{ secrets.PORTAL_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Si hay turnos ofrecidos, espera tu respuesta en Telegram para reservar enseguida.
          LISTEN_MINUTES: "12"
          DRY_RUN: ${{ vars.DRY_RUN || '0' }}
        run: python check_turnos.py

      - name: Guardar estado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: turnos-state-${{ github.run_id }}
